name: Feature Request
description: Suggest a focused cms-lab improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should cms-lab do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Core checks
        - CMS adapter
        - HTML report
        - Docs/site
        - CI/release
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any simpler or narrower approaches?
  - type: textarea
    id: verification
    attributes:
      label: Suggested Verification
      description: What tests, fixtures, or real CMS setup would prove this works?
