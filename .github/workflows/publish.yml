name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    if: github.repository == 'i-afaqrashid/cms-lab'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 30
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: pnpm release:verify-tag

      - name: Verify workspace
        run: pnpm verify

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Smoke packaged CLI
        run: pnpm smoke:pack -- --skip-build

      - name: Pack packages
        run: |
          mkdir -p .release-packages
          pnpm -r --filter './packages/*' pack --pack-destination .release-packages

      - name: Publish packages
        run: pnpm release:publish-tarballs .release-packages

  sbom:
    name: Generate and attach SBOM
    needs: publish
    if: github.repository == 'i-afaqrashid/cms-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate CycloneDX SBOM
        # Best-effort: a SBOM hiccup must never block an already-published release.
        continue-on-error: true
        run: npx --yes @cyclonedx/cdxgen@11 --type pnpm --output sbom.json --no-recurse .

      - name: Upload SBOM artifact
        if: hashFiles('sbom.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Attach SBOM to the release
        if: hashFiles('sbom.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" sbom.json --clobber
