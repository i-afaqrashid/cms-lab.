name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    if: github.repository == 'i-afaqrashid/cms-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Prepare pnpm store
        run: |
          PNPM_STORE_PATH="$(pnpm store path --silent)"
          mkdir -p "$PNPM_STORE_PATH"
          echo "PNPM_STORE_PATH=$PNPM_STORE_PATH" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-${{ github.job }}-node-24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-node-24-pnpm-
            ${{ runner.os }}-node-24-pnpm-
            ${{ runner.os }}-pnpm-

      - name: Tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: apps/site/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/site/**/*.js', 'apps/site/**/*.jsx', 'apps/site/**/*.ts', 'apps/site/**/*.tsx', 'apps/site/**/*.css', 'apps/site/**/*.mdx', 'apps/site/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Verify release tag
        run: pnpm release:verify-tag

      - name: Verify workspace
        run: pnpm verify

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Smoke packaged CLI
        run: pnpm smoke:pack -- --skip-build

      - name: Pack packages
        run: |
          mkdir -p .release-packages
          pnpm -r --filter './packages/*' pack --pack-destination .release-packages

      - name: Publish packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          pnpm release:publish-tarballs .release-packages
