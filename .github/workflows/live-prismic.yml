name: Live Prismic Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-prismic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Prepare pnpm store
        run: |
          PNPM_STORE_PATH="$(pnpm store path --silent)"
          mkdir -p "$PNPM_STORE_PATH"
          echo "PNPM_STORE_PATH=$PNPM_STORE_PATH" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-${{ github.job }}-node-22-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-node-22-pnpm-
            ${{ runner.os }}-node-22-pnpm-
            ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Packaged CLI live smoke
        run: pnpm smoke:pack:live -- --skip-build

      - name: Live doctor
        run: pnpm live:doctor

      - name: Live scan
        run: pnpm live:scan
